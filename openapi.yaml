openapi: 3.0.4
info:
  title: Dividends
  description: >-
    Dividends returns the dividend-per-share history for a US public company by
    ticker - the amount reported each quarter and year straight from official
    SEC filings - plus a derived dividend-growth summary with year-over-year
    growth, multi-year growth rates and a consecutive-years-of-growth streak
    calculated for you.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/dividends:
    get:
      summary: Dividends
      description: >-
        Get the dividend-per-share history for a company by ticker symbol.
        Optionally choose the annual or quarterly series and limit how many
        periods are returned.
      operationId: dividends
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, KO)
          example: AAPL
        - name: period
          in: query
          schema:
            type: string
          required: false
          description: >-
            Which series to return in the history list: quarterly (default) or
            annual.
          example: annual
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Number of periods to return in the history list (1-25). Defaults to
            5.
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  cik: '0000320193'
                  company: Apple Inc.
                  currency: USD
                  paysDividend: true
                  latestDividendPerShare: 0.26
                  latestDividendPeriod: CY2026Q1
                  latestDividendDate: '2026-03-28'
                  count: 5
                  dividends:
                    - period: CY2026Q1
                      periodEnd: '2026-03-28'
                      perShare: 0.26
                      form: 10-Q
                    - period: CY2025Q4
                      periodEnd: '2025-12-27'
                      perShare: 0.26
                      form: 10-Q
                    - period: CY2025Q2
                      periodEnd: '2025-06-28'
                      perShare: 0.26
                      form: 10-Q
                    - period: CY2025Q1
                      periodEnd: '2025-03-29'
                      perShare: 0.25
                      form: 10-Q
                    - period: CY2024Q4
                      periodEnd: '2024-12-28'
                      perShare: 0.25
                      form: 10-Q
                  analytics:
                    dividendGrowth1Y: 4.08
                    dividendGrowth3YCagr: 4.26
                    dividendGrowth5YCagr: 5.11
                    consecutiveYearsOfGrowth: 7
                    averageAnnualGrowthRate: 5.98
                    isDividendGrower: true
                    annualHistory:
                      - period: CY2018
                        perShare: 0.68
                      - period: CY2019
                        perShare: 0.75
                      - period: CY2020
                        perShare: 0.795
                      - period: CY2021
                        perShare: 0.85
                      - period: CY2022
                        perShare: 0.9
                      - period: CY2023
                        perShare: 0.94
                      - period: CY2024
                        perShare: 0.98
                      - period: CY2025
                        perShare: 1.02
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
